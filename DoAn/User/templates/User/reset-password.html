{% extends 'base.html' %}

{% block content %}

<div class="container">
    <div class="row">
        <div class="col-sm-4 col-sm-offset-4">

            <h2>New Password</h2>

            {% if messages %}
                {% for message in messages %}
                    <p>{{ message }}</p>
                {% endfor %}
            {% endif %}

            <form method="POST">

                {% csrf_token %}

                <input
                    type="password"
                    name="password"
                    placeholder="New Password"
                    class="form-control"
                    required
                >

                <br>

                <input
                    type="password"
                    name="confirm_password"
                    placeholder="Confirm Password"
                    class="form-control"
                    required
                >

                <br>

                <button
                    type="submit"
                    class="btn btn-warning"
                >
                    Change Password
                </button>

            </form>

        </div>
    </div>
</div>

{% endblock %}
