{% load static %}

<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Reset Password</title>

    <link rel="stylesheet" href="{% static 'user/style.css' %}">
</head>

<body>

<div class="container">

    <a href="{% url 'login' %}" class="back">
        ←
    </a>

    <h2>Reset Password</h2>

    <p class="description">
        Enter your new password below.
    </p>

    {% if validlink %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <div class="input-box">

                    <span class="input-icon">🔒</span>

                    <input
                        type="password"
                        name="new_password1"
                        placeholder="New Password"
                        required
                    >

                </div>
            </div>

            <div class="form-group">
                <div class="input-box">

                    <span class="input-icon">🔒</span>

                    <input
                        type="password"
                        name="new_password2"
                        placeholder="Confirm Password"
                        required
                    >

                </div>
            </div>

            <button class="btn" type="submit">
                Change Password
            </button>

        </form>

    {% else %}

        <p class="description">
            This password reset link is invalid or has expired.
        </p>

        <div class="link">
            <a href="{% url 'password_reset' %}">
                Request a new reset link
            </a>
        </div>

    {% endif %}

</div>

</body>
</html>
