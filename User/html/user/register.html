{% load static %}

<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Create Account</title>

    <link rel="stylesheet" href="{% static 'user/style.css' %}">
</head>

<body>

<div class="container">

    <!-- Nút quay lại -->
    <a href="{% url 'login' %}" class="back">
        ←
    </a>

    <!-- Tiêu đề -->
    <h2>Create Account</h2>

    <p class="description">
        Create a new account to get started and enjoy
        seamless access to our features.
    </p>

    <!-- Thông báo -->
    {% if messages %}
        {% for message in messages %}
            <div class="message">
                {{ message }}
            </div>
        {% endfor %}
    {% endif %}

    <!-- Form đăng ký -->
    <form method="POST" action="/api/auth/register/">

        {% csrf_token %}

        <!-- Tên đăng nhập -->
        <div class="form-group">
            <div class="input-box">

                <span class="input-icon">●</span>

                <input
                    type="text"
                    name="username"
                    placeholder="Name"
                    required
                >

            </div>
        </div>

        <!-- Email -->
        <div class="form-group">
            <div class="input-box">

                <span class="input-icon">✉</span>

                <input
                    type="email"
                    name="email"
                    placeholder="Email address"
                    required
                >

            </div>
        </div>

        <!-- Mật khẩu -->
        <div class="form-group">
            <div class="input-box">

                <span class="input-icon">🔒</span>

                <input
                    type="password"
                    name="password"
                    placeholder="Password"
                    required
                >

            </div>
        </div>

        <!-- Nhập lại mật khẩu -->
        <div class="form-group">
            <div class="input-box">

                <span class="input-icon">🔒</span>

                <input
                    type="password"
                    name="password2"
                    placeholder="Confirm Password"
                    required
                >

            </div>
        </div>

        <!-- Nút đăng ký -->
        <button class="btn" type="submit">
            Create Account
        </button>

    </form>

    <!-- Link đăng nhập -->
    <div class="link">

        Already have an account?

        <a href="{% url 'login' %}">
            Log in
        </a>

    </div>

</div>

</body>
</html>
