{% load static %}

<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <title>Forgot Password</title>

    <link rel="stylesheet" href="{% static 'user/style.css' %}">
</head>

<body>

<div class="container">

    <a href="{% url 'login' %}" class="back">
        ←
    </a>

    <h2>Forgot Password?</h2>

    <p class="description">
        Enter your email address and we will send you
        a link to reset your password.
    </p>

    <form method="POST">

        {% csrf_token %}

        <div class="form-group">

            <div class="input-box">

                <span class="input-icon">✉</span>

                <input
                    type="email"
                    name="email"
                    placeholder="Email address"
                    required
                >

            </div>

        </div>

        <button class="btn" type="submit">
            Send Reset Link
        </button>

    </form>

    <div class="link">

        Remember your password?

        <a href="{% url 'login' %}">
            Log in
        </a>

    </div>

</div>

</body>
</html>
