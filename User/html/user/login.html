<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập</title>
</head>

<body>

<h2>Đăng nhập</h2>

{% if messages %}
    {% for message in messages %}
        <p>{{ message }}</p>
    {% endfor %}
{% endif %}

<form method="POST">
    {% csrf_token %}

    <div>
        <label>Email</label>
        <input
            type="email"
            name="email"
            required
        >
    </div>

    <br>

    <div>
        <label>Mật khẩu</label>
        <input
            type="password"
            name="password"
            required
        >
    </div>

    <br>

    <button type="submit">Đăng nhập</button>
</form>

<p>
    Chưa có tài khoản?
    <a href="{% url 'register' %}">Đăng ký</a>
</p>

</body>
</html>
