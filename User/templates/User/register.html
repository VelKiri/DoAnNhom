{% extends 'base.html' %}
{% load static %}

{% block title %}New User Signup | AcademicShare{% endblock %}

{% block content %}
<style>
    /* 1. Khóa cuộn trang và đặt ảnh nền */
    html, body {
        height: 100vh;
        margin: 0;
        overflow: hidden;
        background: url("{% static 'global/images/BookBG.png' %}") no-repeat center center fixed !important;
        background-size: cover !important;
    }

    /* 2. Hàng trên cùng (chứa email và số điện thoại): Giữ nguyên màu đen tuyền rõ nét */
    .header_top, .header-top {
        background-color: #000000 !important;
        border-bottom: 1px solid #222 !important;
    }

    .header_top a, .header_top span, .header_top p, .header_top li, .header_top i,
    .contactinfo ul li a, .social-icons ul li a {
        color: #ffffff !important;
    }

    /* 3. Phần menu và các header bên dưới: Tăng độ trong suốt (giảm độ đậm của màu đen xuống) */
    header .header-middle, header .header-bottom, header .shop-menu {
        background-color: rgba(0, 0, 0, 0.45) !important; /* Đã tăng độ trong suốt, giúp nhìn rõ ảnh nền phía sau hơn */
        backdrop-filter: blur(5px); /* Hiệu ứng mờ nhẹ cho thanh menu */
    }
    
    .shop-menu ul li a, .nav navbar-nav li a {
        color: #ffffff !important;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6); /* Giúp chữ nổi bật trên nền trong suốt */
    }

    /* 4. Căn giữa khung form đăng ký */
    .signup-wrapper {
        height: calc(100vh - 120px);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Hộp Register bán trong suốt (hiệu ứng kính mờ) */
    .signup-box {
        background: rgba(255, 255, 255, 0.25) !important;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: 30px 40px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        width: 100%;
        max-width: 480px;
    }

    .signup-box h3 {
        font-size: 30px; 
        font-weight: bold;
        text-align: center;
        margin-bottom: 5px;
        color: #ffffff !important;
        text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .signup-box p.subtitle {
        text-align: center;
        color: #f1f1f1 !important;
        font-size: 14px;
        margin-bottom: 25px;
    }

    /* 5. Căn chỉnh khung chứa input và icon chuẩn xác */
    .input-group-custom {
        position: relative;
        margin-bottom: 15px;
        width: 100%;
    }

    /* Icon SVG nhúng trực tiếp */
    .input-group-custom .input-icon {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        width: 18px;
        height: 18px;
        fill: #555;
        z-index: 10;
    }

    .input-group-custom .form-control {
        height: 48px;
        padding-left: 45px !important;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.6);
        background: rgba(255, 255, 255, 0.85);
        width: 100% !important;
        box-sizing: border-box;
    }

    .btn-signup {
        width: 100%;
        height: 48px;
        background-color: #ff9800;
        border: none;
        color: white;
        font-weight: bold;
        border-radius: 8px;
        font-size: 16px;
        margin-top: 10px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        cursor: pointer;
    }

    .btn-signup:hover {
        background-color: #e68a00;
    }
</style>

<div class="signup-wrapper">
    <div class="signup-box">
        <h3>New User Signup!</h3>
        <p class="subtitle">Create your account to get started.</p>

        <form method="POST">
            {% csrf_token %}
            
            <!-- Ô Username kèm Icon User SVG -->
            <div class="input-group-custom">
                <svg class="input-icon" viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
                <input type="text" name="username" class="form-control" placeholder="Username" required>
            </div>

            <!-- Ô Email Address kèm Icon Email SVG -->
            <div class="input-group-custom">
                <svg class="input-icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-2V8l8 5 8-5v2z"/></svg>
                <input type="email" name="email" class="form-control" placeholder="Email Address" required>
            </div>

            <!-- Ô Password kèm Icon Khóa SVG -->
            <div class="input-group-custom">
                <svg class="input-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                <input type="password" name="password1" class="form-control" placeholder="Password" required>
            </div>

            <!-- Ô Confirm Password kèm Icon Khóa SVG -->
            <div class="input-group-custom">
                <svg class="input-icon" viewBox="0 0 24 24"><path d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zm-6 9c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2zm3.1-9H8.9V6c0-1.71 1.39-3.1 3.1-3.1 1.71 0 3.1 1.39 3.1 3.1v2z"/></svg>
                <input type="password" name="password2" class="form-control" placeholder="Confirm Password" required>
            </div>

            <button type="submit" class="btn-signup">Signup</button>
        </form>
    </div>
</div>
{% endblock %}
