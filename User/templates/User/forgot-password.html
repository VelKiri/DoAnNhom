{% extends 'base.html' %}
{% load static %}

{% block title %}Forgot Password | AcademicShare{% endblock %}

{% block content %}
<style>
    /* 1. Khóa cuộn trang và đặt ảnh nền thống nhất */
    html, body {
        height: 100vh;
        margin: 0;
        overflow: hidden;
        background: url("{% static 'global/images/fpBG.png' %}") no-repeat center center fixed !important;
        background-size: cover !important;
    }

    /* 2. Hàng trên cùng (chứa email và số điện thoại): Màu đen tuyền rõ nét */
    .header_top, .header-top {
        background-color: #000000 !important;
        border-bottom: 1px solid #222 !important;
    }

    .header_top a, .header_top span, .header_top p, .header_top li, .header_top i,
    .contactinfo ul li a, .social-icons ul li a {
        color: #ffffff !important;
    }

    /* 3. Phần menu và các header bên dưới: Trong suốt */
    header .header-middle, header .header-bottom, header .shop-menu {
        background-color: rgba(0, 0, 0, 0.45) !important;
        backdrop-filter: blur(5px);
    }
    
    .shop-menu ul li a, .nav navbar-nav li a {
        color: #ffffff !important;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.6);
    }

    /* 4. Căn giữa khung form quên mật khẩu */
    .forgot-wrapper {
        height: calc(100vh - 120px);
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* Hộp Forgot Password bán trong suốt (hiệu ứng kính mờ) */
    .forgot-box {
        background: rgba(255, 255, 255, 0.25) !important;
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        padding: 30px 40px;
        border-radius: 16px;
        border: 1px solid rgba(255, 255, 255, 0.4);
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        width: 100%;
        max-width: 480px;
    }

    .forgot-box h3 {
        font-size: 28px; 
        font-weight: bold;
        text-align: center;
        margin-bottom: 8px;
        color: #ffffff !important;
        text-shadow: 0 2px 4px rgba(0,0,0,0.3);
    }

    .forgot-box p.subtitle {
        text-align: center;
        color: #f1f1f1 !important;
        font-size: 13.5px;
        margin-bottom: 25px;
        line-height: 1.4;
    }

    /* 5. Căn chỉnh khung chứa input và icon chuẩn xác */
    .input-group-custom {
        position: relative;
        margin-bottom: 15px;
        width: 100%;
    }

    /* Icon SVG nhúng trực tiếp */
    .input-group-custom .input-icon {
        position: absolute;
        left: 15px;
        top: 50%;
        transform: translateY(-50%);
        width: 18px;
        height: 18px;
        fill: #555;
        z-index: 10;
    }

    .input-group-custom .form-control {
        height: 48px;
        padding-left: 45px !important;
        border-radius: 8px;
        border: 1px solid rgba(255, 255, 255, 0.6);
        background: rgba(255, 255, 255, 0.85);
        width: 100% !important;
        box-sizing: border-box;
    }

    .back-to-login {
        text-align: center;
        margin-top: 15px;
        font-size: 14px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
    }

    .back-to-login a {
        color: #ffffff;
        text-decoration: none;
        font-weight: 500;
        display: inline-flex;
        align-items: center;
        gap: 6px;
    }

    .back-to-login a:hover {
        color: #ff9800;
        text-decoration: underline;
    }

    /* SVG icon mũi tên quay lại */
    .back-to-login svg {
        width: 16px;
        height: 16px;
        fill: #ffffff;
        transition: fill 0.2s;
    }

    .back-to-login a:hover svg {
        fill: #ff9800;
    }

    .btn-forgot {
        width: 100%;
        height: 48px;
        background-color: #ff9800;
        border: none;
        color: white;
        font-weight: bold;
        border-radius: 8px;
        font-size: 16px;
        margin-top: 5px;
        box-shadow: 0 4px 10px rgba(0,0,0,0.2);
        cursor: pointer;
    }

    .btn-forgot:hover {
        background-color: #e68a00;
    }
</style>

<div class="forgot-wrapper">
    <div class="forgot-box">
        <h3>Reset Password</h3>
        <p class="subtitle">Enter your email address and we'll send you a link to reset your password.</p>

        <form method="POST">
            {% csrf_token %}
            
            <!-- Ô Email Address -->
            <div class="input-group-custom">
                <svg class="input-icon" viewBox="0 0 24 24"><path d="M20 4H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2zm0 4l-8 5-8-2V8l8 5 8-5v2z"/></svg>
                <input type="email" name="email" class="form-control" placeholder="Enter your email address" required>
            </div>

            <button type="submit" class="btn-forgot">Send Reset Link</button>

            <div class="back-to-login">
                <a href="{% url 'login' %}">
                    <!-- Icon mũi tên quay lại dạng SVG chuẩn -->
                    <svg viewBox="0 0 24 24"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
                    Back to Login
                </a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
